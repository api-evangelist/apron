aid: apron
name: Apron
description: >-
  Apron is a London, UK-based financial technology company that helps small
  business owners, accountants, and bookkeepers automate supplier payments,
  payroll, expenses, and payment collection. The platform captures invoices,
  batches and pays bills directly from a business bank account, and reconciles
  transactions in real time with accounting software such as Xero and QuickBooks
  Online. Founded by Bogdan Uzbekov (an early Revolut operator), Apron serves
  more than 10,000 businesses and is an FCA-authorised Electronic Money
  Institution (firm reference 1004915), ISO 27001 certified, and regulated under
  the UK Payment Services Regulations 2017 and Electronic Money Regulations 2011.
  Apron does not currently publish a public developer API; it integrates as a
  consumer of the Xero and QuickBooks accounting APIs.
